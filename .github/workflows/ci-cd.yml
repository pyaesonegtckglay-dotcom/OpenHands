name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, "manusai-phase1-3-complete", "manusai-phase4-*"]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ===================== LINT & TYPE CHECK =====================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black mypy ruff

      - name: Run flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        working-directory: hf-backend

      - name: Run black (check formatting)
        run: |
          black --check --diff .
        working-directory: hf-backend

      - name: Run ruff
        run: |
          ruff check .
        working-directory: hf-backend

  # ===================== UNIT TESTS =====================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-test-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov
        working-directory: hf-backend

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short --cov=. --cov-report=xml
        working-directory: hf-backend

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: hf-backend/coverage.xml
          fail_ci_if_error: false

  # ===================== BUILD =====================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./hf-backend
          push: true
          tags: |
            manusai/backend:latest
            manusai/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===================== DEPLOY TO RENDER =====================
  deploy-render:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://manusai-backend.onrender.com
    steps:
      - name: Trigger Render Deploy
        run: |
          curl -X POST "https://api.render.com/v1/services/srv-d8khsepo3t8c73erejdg/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}'
        continue-on-error: true

      - name: Wait for deployment
        run: sleep 120

      - name: Verify deployment
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://manusai-backend.onrender.com/health)
          if [ "$response" = "200" ]; then
            echo "✅ Backend deployed successfully!"
          else
            echo "⚠️ Backend health check returned $response"
          fi

  # ===================== DEPLOY FRONTEND =====================
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://manusai-frontend.vercel.app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: vercel-frontend

      - name: Verify frontend deployment
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://manusai-frontend.vercel.app)
          if [ "$response" = "200" ]; then
            echo "✅ Frontend deployed successfully!"
          else
            echo "⚠️ Frontend returned $response"
          fi

  # ===================== NOTIFICATION =====================
  notify:
    name: Notify on Completion
    runs-on: ubuntu-latest
    needs: [deploy-render, deploy-frontend]
    if: always()
    steps:
      - name: Send notification
        if: needs.deploy-render.outputs.status == 'success' || needs.deploy-frontend.outputs.status == 'success'
        run: |
          echo "📊 Deployment Summary:"
          echo "  - Backend: ${{ needs.deploy-render.result }}"
          echo "  - Frontend: ${{ needs.deploy-frontend.result }}"