services:
  - type: web
    name: manusai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ping
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: E2B_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: SERVE_FRONTEND
        value: "false"
      - key: GEMINI_API_KEYS
        sync: false
      - key: GITHUB_MODELS_TOKENS
        sync: false
      - key: SAMBANOVA_API_KEYS
        sync: false
